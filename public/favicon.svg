<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Nunito', 'Arial Black', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #FFFFFF;
      }
    </style>
  </defs>
  <g transform="rotate(-4 16 16)">
    <!-- Tactile Shadow -->
    <rect x="2" y="2" width="28" height="28" rx="6" fill="#1A1A2E" />
    <!-- Orange Box with Border -->
    <rect x="1" y="1" width="28" height="28" rx="6" fill="#FF6B35" stroke="#1A1A2E" stroke-width="2.5" />
    <!-- Diagonal Slice Highlight -->
    <path d="M12 -1 L18 -1 L6 33 L0 33 Z" fill="#FFFFFF" opacity="0.2" />
    <!-- Logo Text -->
    <text x="14.5" y="20" font-size="14.5" text-anchor="middle" class="logo-text">S/</text>
  </g>
</svg>
