name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (production = live site)'
        required: true
        type: choice
        options:
          - production
        default: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backoffice: ${{ steps.filter.outputs.backoffice }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backoffice:
              - 'backoffice/**'
              - '.github/workflows/ci-cd.yml'
            app:
              - 'src/**'
              - 'public/**'
              - 'functions/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'e2e-dev/**'
              - 'playwright.config.ts'
              - 'playwright.dev.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'tsconfig*.json'
              - 'firestore.rules'
              - '.github/workflows/ci-cd.yml'

  test:
    name: Test & build
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      # `npm run build` runs `tsc -b && vite build` — the canonical pre-commit gate.
      # Vite needs VITE_FIREBASE_* defined to build; dummy values are fine here
      # because the test job only verifies the bundle compiles. Real values are
      # injected in the deploy jobs.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci-dummy
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-dummy
          VITE_FIREBASE_APP_ID: ci-dummy
          VITE_FIREBASE_MEASUREMENT_ID: ci-dummy

      # Playwright e2e covers the unauthenticated, deterministic surface
      # (landing, legal, routing, i18n). The dev server is booted by
      # playwright.config.ts with dummy VITE_FIREBASE_* values, so no Firebase
      # secrets are required and no real project data is touched.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rules-test:
    name: Firestore rules tests
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # The Firestore emulator is a Java process; pin a JDK rather than rely on
      # the runner image's default.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Adversarial security-rules tests (assertFails/assertSucceeds) against the
      # emulator. `test:rules` wraps vitest in `firebase emulators:exec`, which
      # boots and tears down the emulator around the run. This gates deploys:
      # reopening `list` on /groups or breaking the /joinIds guard fails here
      # BEFORE the rules ship to dev or prod.
      - name: Run Firestore rules tests
        run: npm run test:rules

  deploy-test:
    name: Deploy to test
    needs: [changes, test, rules-test]
    if: ${{ needs.changes.outputs.app == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://preview.slice-75o.pages.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # `build:deploy` prerenders the public routes (see scripts/prerender.js),
      # which drives a headless browser — install chromium first.
      - name: Install Playwright browser (for prerender)
        run: npx playwright install --with-deps chromium

      - name: Build + prerender with test Firebase config
        run: npm run build:deploy
        env:
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Publish to Cloudflare Pages (test)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=slice --branch=preview --commit-dirty=true

      - name: Deploy Firestore rules to dev
        run: npx firebase-tools@latest deploy --only firestore:rules --project dev --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  e2e-dev:
    name: E2E on dev (post-deploy)
    needs: [changes, deploy-test]
    if: ${{ needs.changes.outputs.app == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Cloudflare Pages can take a few seconds to serve the new deployment at
      # the alias URL; poll until it responds before running the suite.
      - name: Wait for dev site to be reachable
        run: |
          for i in $(seq 1 24); do
            if curl -sfo /dev/null "$E2E_BASE_URL"; then echo "dev site is up"; exit 0; fi
            echo "waiting for dev site ($i)..."; sleep 5
          done
          echo "dev site did not become reachable" >&2; exit 1
        env:
          E2E_BASE_URL: https://preview.slice-75o.pages.dev

      # Runs the authenticated suite against the just-deployed dev site (which is
      # built against the dev Firebase project). Tests create throwaway anonymous
      # users + groups and delete them via the app's Delete Account flow.
      - name: Run authenticated e2e against dev URL
        run: npm run test:e2e:dev
        env:
          E2E_BASE_URL: https://preview.slice-75o.pages.dev

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-dev-report
          path: playwright-report/
          retention-days: 7

  deploy-production:
    name: Deploy to production (manual)
    needs: [changes, test, rules-test]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://slice.fusion-labs.cc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # `build:deploy` prerenders the public routes (see scripts/prerender.js),
      # which drives a headless browser — install chromium first.
      - name: Install Playwright browser (for prerender)
        run: npx playwright install --with-deps chromium

      - name: Build + prerender with production Firebase config
        run: npm run build:deploy
        env:
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Publish to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=slice --branch=main --commit-dirty=true

      - name: Deploy Firestore rules to production
        run: npx firebase-tools@latest deploy --only firestore:rules --project default --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-backoffice:
    name: Deploy Backoffice
    needs: changes
    if: ${{ needs.changes.outputs.backoffice == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    environment:
      name: production # Backoffice on Cloudflare connects to the production Firebase database!
      url: https://slice-backoffice.pages.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install backoffice dependencies
        run: cd backoffice && npm ci

      - name: Build backoffice
        run: cd backoffice && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Publish to Cloudflare Pages (Backoffice)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./backoffice/dist --project-name=slice-backoffice --branch=main --commit-dirty=true

  # Posts to Discord when any job above fails. `always()` lets this run even
  # though an upstream job failed; `contains(needs.*.result, 'failure')` fires
  # only on real failures (skipped/cancelled jobs don't count). Needs the
  # DISCORD_WEBHOOK_URL repo secret (Discord channel → Integrations → Webhooks).
  notify-discord:
    name: Notify Discord on failure
    needs: [changes, test, rules-test, deploy-test, e2e-dev, deploy-production, deploy-backoffice]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set — skipping Discord notification." >&2
            exit 0
          fi
          MSG=":x: **CI failed** on \`$BRANCH\`
          Repo: **${{ github.repository }}** · event: \`$EVENT\`
          Commit: \`${SHA:0:7}\` by **$ACTOR**
          Run: $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sfS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
